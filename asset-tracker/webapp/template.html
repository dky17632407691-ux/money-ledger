<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F2">
<title>账本 · 资产与记账</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #F5F5F2;
  --outer: #EDECE7;
  --card: #FFFFFF;
  --line: #EAE8E2;
  --line2: #F2F0EB;
  --tx: #1B1B19;
  --tx2: #6E6D68;
  --tx3: #A6A49E;
  --up: #C4382A;
  --down: #0E8A60;
}
html, body { height: 100%; }
body {
  background: var(--outer);
  color: var(--tx);
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.app {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  padding-bottom: 80px;
  position: relative;
  overflow-x: hidden;
  box-shadow: 0 0 0 1px rgba(0,0,0,.04);
}
.view { display: none; animation: fade .18s ease; }
.view.on { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.hero { padding: 30px 20px 22px; }
.hero-label { font-size: 12px; color: var(--tx2); letter-spacing: .03em; }
.hero-value {
  font-size: 40px; font-weight: 600; letter-spacing: -1.5px;
  margin-top: 7px; font-variant-numeric: tabular-nums; line-height: 1.05;
}
.hero-value .unit { font-size: 22px; font-weight: 500; letter-spacing: 0; margin-right: 2px; }
.hero-sub { margin-top: 12px; display: flex; gap: 14px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.hero-sub span { color: var(--tx2); }
.up { color: var(--up); }
.down { color: var(--down); }

.card { background: var(--card); border-radius: 16px; margin: 0 16px 11px; padding: 17px 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.card-title { font-size: 13px; font-weight: 500; color: var(--tx); }
.link { font-size: 12px; color: var(--tx3); cursor: pointer; }
.link:active { opacity: .6; }

.bar-row { margin-bottom: 13px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; }
.bar-top .n { color: var(--tx2); }
.bar-top .v { color: var(--tx); font-variant-numeric: tabular-nums; }
.track { height: 6px; background: #F1EFEA; border-radius: 3px; overflow: hidden; }
.fill { height: 100%; border-radius: 3px; transition: width .5s cubic-bezier(.1,.8,.3,1); }

.h-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line2); }
.h-row:last-child { border-bottom: none; padding-bottom: 0; }
.h-row:first-child { padding-top: 0; }
.h-left { min-width: 0; }
.h-name { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-code { font-size: 11px; color: var(--tx3); margin-top: 3px; font-variant-numeric: tabular-nums; }
.h-right { text-align: right; flex-shrink: 0; margin-left: 12px; }
.h-mv { font-size: 13.5px; font-variant-numeric: tabular-nums; }
.h-pnl { font-size: 11.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-left: 5px; vertical-align: 1px; }
.ta { background: #FBEAE7; color: #A63222; }
.th { background: #EAF1FB; color: #1F5A9E; }
.tu { background: #EFEBFA; color: #5B44A8; }
.tf { background: #EAF4EC; color: #2C6B3F; }
.stale { font-size: 10px; color: var(--tx3); margin-left: 4px; }

.page-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 20px 14px; position: sticky; top: 0; background: var(--bg); z-index: 5;
}
.page-title { font-size: 17px; font-weight: 600; letter-spacing: -.2px; }
.month-nav { display: flex; align-items: center; gap: 4px; }
.month-nav button {
  border: none; background: rgba(0,0,0,.045); width: 28px; height: 28px; border-radius: 8px;
  font-size: 15px; color: var(--tx2); cursor: pointer; line-height: 1;
}
.month-nav button:active { background: rgba(0,0,0,.1); }
.month-nav .m { font-size: 12.5px; color: var(--tx2); width: 78px; text-align: center; font-variant-numeric: tabular-nums; }

.sum-strip {
  display: flex; justify-content: space-between;
  margin: 0 16px 11px; padding: 15px 18px; background: var(--card); border-radius: 16px;
}
.sum-strip div { text-align: center; flex: 1; }
.sum-strip .k { font-size: 11px; color: var(--tx3); margin-bottom: 5px; }
.sum-strip .v { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }

.day-group { margin: 0 16px 14px; }
.day-head {
  display: flex; justify-content: space-between; font-size: 11.5px; color: var(--tx3);
  padding: 6px 4px 8px; font-variant-numeric: tabular-nums;
}
.txn-list { background: var(--card); border-radius: 14px; overflow: hidden; }
.txn { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--line2); cursor: pointer; }
.txn:last-child { border-bottom: none; }
.txn:active { background: #FAF9F6; }
.ico {
  width: 33px; height: 33px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: #fff; font-weight: 500;
}
.txn-mid { flex: 1; margin-left: 11px; min-width: 0; }
.txn-cat { font-size: 13.5px; font-weight: 500; }
.txn-note { font-size: 11px; color: var(--tx3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txn-amt { font-size: 14px; font-variant-numeric: tabular-nums; flex-shrink: 0; margin-left: 10px; }

.donut-wrap { display: flex; justify-content: center; padding: 6px 0 20px; }
.donut { width: 168px; height: 168px; border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; }
.donut::after { content: ''; position: absolute; inset: 26px; background: var(--card); border-radius: 50%; }
.donut-c { position: relative; z-index: 2; text-align: center; }
.donut-c .k { font-size: 11px; color: var(--tx3); }
.donut-c .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 3px; letter-spacing: -.5px; }

.cat-row { display: flex; align-items: center; padding: 9px 0; }
.cat-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.cat-n { font-size: 12.5px; margin-left: 9px; flex: 1; }
.cat-v { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.cat-p { font-size: 11.5px; color: var(--tx3); width: 44px; text-align: right; font-variant-numeric: tabular-nums; }

.empty { text-align: center; padding: 46px 20px; color: var(--tx3); font-size: 12.5px; }
.empty .big { font-size: 14px; color: var(--tx2); margin-bottom: 6px; }

.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; max-width: 430px; margin: 0 auto;
  background: rgba(255,255,255,.96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 7px 0 calc(7px + env(safe-area-inset-bottom)); z-index: 20;
}
.tab { text-align: center; cursor: pointer; padding: 2px 0; }
.tab .t { font-size: 10px; color: var(--tx3); margin-top: 2px; }
.tab.on .t { color: var(--tx); font-weight: 500; }
.tab svg { width: 21px; height: 21px; stroke: var(--tx3); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tab.on svg { stroke: var(--tx); }
.tab-add { display: flex; align-items: center; justify-content: center; }
.add-btn {
  width: 44px; height: 44px; border-radius: 50%; background: var(--tx); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 300;
  line-height: 1; margin-top: -14px; box-shadow: 0 4px 14px rgba(0,0,0,.18); cursor: pointer;
  transition: transform .12s;
}
.add-btn:active { transform: scale(.92); }

.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.32); z-index: 50; display: none; align-items: flex-end; }
.sheet.on { display: flex; }
.panel {
  width: 100%; max-width: 430px; margin: 0 auto; background: #fff;
  border-radius: 22px 22px 0 0; padding: 8px 20px calc(20px + env(safe-area-inset-bottom));
  animation: sheetUp .24s cubic-bezier(.2,.9,.3,1); max-height: 90vh; overflow-y: auto;
}
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
.grab { width: 36px; height: 4px; border-radius: 2px; background: #E4E2DC; margin: 6px auto 16px; }
.panel-title { font-size: 15px; font-weight: 600; margin-bottom: 18px; }
.amt-input {
  display: flex; align-items: baseline; border-bottom: 1.5px solid var(--tx); padding-bottom: 8px; margin-bottom: 20px;
}
.amt-input .cur { font-size: 22px; font-weight: 500; margin-right: 6px; }
.amt-input input {
  border: none; outline: none; font-size: 34px; font-weight: 600; width: 100%;
  font-family: inherit; font-variant-numeric: tabular-nums; letter-spacing: -1px; background: transparent;
}
.amt-input input::placeholder { color: #DCDAD3; }
.seg { display: flex; background: #F3F2ED; border-radius: 10px; padding: 3px; margin-bottom: 18px; }
.seg div { flex: 1; text-align: center; font-size: 12.5px; padding: 7px 0; border-radius: 8px; color: var(--tx2); cursor: pointer; }
.seg div.on { background: #fff; color: var(--tx); font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 6px; margin-bottom: 18px; }
.gi { text-align: center; padding: 9px 0 7px; border-radius: 11px; cursor: pointer; border: 1.5px solid transparent; }
.gi.on { background: #F7F6F2; border-color: var(--tx); }
.gi .c {
  width: 34px; height: 34px; border-radius: 11px; margin: 0 auto 6px;
  display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; font-weight: 500;
}
.gi .n { font-size: 11px; color: var(--tx2); }
.gi.on .n { color: var(--tx); font-weight: 500; }
.note-input {
  width: 100%; border: none; background: #F7F6F2; border-radius: 10px;
  padding: 11px 13px; font-size: 13px; font-family: inherit; outline: none; margin-bottom: 18px;
}
.note-input::placeholder { color: var(--tx3); }
.save-btn {
  width: 100%; background: var(--tx); color: #fff; border: none; border-radius: 13px;
  padding: 15px; font-size: 15px; font-weight: 500; font-family: inherit; cursor: pointer;
}
.save-btn:active { opacity: .85; }
.save-btn:disabled { background: #DCDAD3; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11.5px; color: var(--tx2); margin-bottom: 6px; }
.field input, .field select {
  width: 100%; border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 13px; font-size: 14px; font-family: inherit; outline: none; background: #fff;
}
.field input:focus, .field select:focus { border-color: var(--tx2); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toast {
  position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
  background: rgba(27,27,25,.92); color: #fff; font-size: 12.5px; padding: 10px 18px;
  border-radius: 10px; z-index: 99; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  white-space: nowrap;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(-6px); }
.foot-note { text-align: center; font-size: 10.5px; color: #BFBDB6; padding: 18px 30px 8px; line-height: 1.7; }
</style>
</head>
<body>
<div class="app">

  <!-- 资产 -->
  <section class="view on" id="v-assets">
    <div class="hero">
      <div class="hero-label">总资产（折算人民币）</div>
      <div class="hero-value" id="total-mv">—</div>
      <div class="hero-sub">
        <span id="day-pnl">—</span>
        <span id="all-pnl">—</span>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">资产配置</div><div class="link" onclick="go('holdings')">明细</div></div>
      <div id="alloc"></div>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">持仓</div><div class="link" onclick="go('holdings')">全部</div></div>
      <div id="home-holdings"></div>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">本月支出</div><div class="link" onclick="go('summary')">查看</div></div>
      <div id="home-spend"></div>
    </div>
    <div class="foot-note">行情数据更新于 <span id="data-time">—</span><br>基金净值以官方公布为准</div>
  </section>

  <!-- 流水 -->
  <section class="view" id="v-flow">
    <div class="page-head">
      <div class="page-title">流水</div>
      <div class="month-nav">
        <button onclick="shiftMonth(-1)">‹</button>
        <div class="m" id="flow-month">—</div>
        <button onclick="shiftMonth(1)">›</button>
      </div>
    </div>
    <div class="sum-strip" id="flow-sum"></div>
    <div id="flow-list"></div>
  </section>

  <!-- 汇总 -->
  <section class="view" id="v-summary">
    <div class="page-head">
      <div class="page-title">汇总</div>
      <div class="month-nav">
        <button onclick="shiftMonth(-1)">‹</button>
        <div class="m" id="sum-month">—</div>
        <button onclick="shiftMonth(1)">›</button>
      </div>
    </div>
    <div class="card" id="summary-card"></div>
  </section>

  <!-- 持仓 -->
  <section class="view" id="v-holdings">
    <div class="page-head">
      <div class="page-title">持仓</div>
      <div class="link" onclick="openHolding()">＋ 添加</div>
    </div>
    <div class="card" id="holdings-card"></div>
    <div class="foot-note">价格与净值来自公开行情接口<br>港币美元按当日汇率折算</div>
  </section>

  <nav class="tabbar">
    <div class="tab on" data-v="assets" onclick="go('assets')">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
      <div class="t">资产</div>
    </div>
    <div class="tab" data-v="flow" onclick="go('flow')">
      <svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
      <div class="t">流水</div>
    </div>
    <div class="tab tab-add" onclick="openAdd()">
      <div class="add-btn">＋</div>
    </div>
    <div class="tab" data-v="summary" onclick="go('summary')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v8.5l6 4"/></svg>
      <div class="t">汇总</div>
    </div>
    <div class="tab" data-v="holdings" onclick="go('holdings')">
      <svg viewBox="0 0 24 24"><path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M22 19H2"/></svg>
      <div class="t">持仓</div>
    </div>
  </nav>
</div>

<!-- 记一笔 -->
<div class="sheet" id="sheet-add" onclick="if(event.target===this)closeAdd()">
  <div class="panel">
    <div class="grab"></div>
    <div class="panel-title">记一笔</div>
    <div class="amt-input">
      <div class="cur">¥</div>
      <input id="in-amt" type="number" inputmode="decimal" placeholder="0" autocomplete="off">
    </div>
    <div class="seg" id="seg-type">
      <div class="on" onclick="setType('expense')">支出</div>
      <div onclick="setType('income')">收入</div>
    </div>
    <div class="grid" id="cat-grid"></div>
    <input class="note-input" id="in-note" placeholder="备注（选填）" maxlength="30">
    <button class="save-btn" id="btn-save" onclick="saveTxn()" disabled>保存</button>
  </div>
</div>

<!-- 添加持仓 -->
<div class="sheet" id="sheet-holding" onclick="if(event.target===this)closeHolding()">
  <div class="panel">
    <div class="grab"></div>
    <div class="panel-title">添加持仓</div>
    <div class="field">
      <label>标的代码</label>
      <input id="h-code" placeholder="如 600519 / 00700 / AAPL / 110011" autocomplete="off">
    </div>
    <div class="field-row">
      <div class="field">
        <label>类型</label>
        <select id="h-type">
          <option value="a">A 股</option>
          <option value="hk">港股</option>
          <option value="us">美股</option>
          <option value="fund">场外基金</option>
        </select>
      </div>
      <div class="field">
        <label>成本价（原币种）</label>
        <input id="h-cost" type="number" inputmode="decimal" placeholder="0.00">
      </div>
    </div>
    <div class="field">
      <label>持有份额 / 股数</label>
      <input id="h-shares" type="number" inputmode="decimal" placeholder="0">
    </div>
    <button class="save-btn" onclick="saveHolding()">添加</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DATA = __DATA__;

const CATS = {
  expense: [
    { k: 'food',    n: '餐饮', c: '#C9594A' },
    { k: 'traffic', n: '交通', c: '#4A78B8' },
    { k: 'shop',    n: '购物', c: '#7A66C0' },
    { k: 'home',    n: '居住', c: '#B08A3E' },
    { k: 'fun',     n: '娱乐', c: '#C2718F' },
    { k: 'comm',    n: '通讯', c: '#4E8A5F' },
    { k: 'med',     n: '医疗', c: '#4E8B8B' },
    { k: 'gift',    n: '人情', c: '#A2694E' }
  ],
  income: [
    { k: 'salary', n: '工资', c: '#C4382A' },
    { k: 'bonus',  n: '奖金', c: '#B05A3C' },
    { k: 'other',  n: '其他', c: '#7A66C0' }
  ]
};
const CAT_MAP = {};
[...CATS.expense, ...CATS.income].forEach(c => CAT_MAP[c.k] = c);

const STORE = 'ledger_proto_v1';
let txns = JSON.parse(localStorage.getItem(STORE) || 'null');
let extraHoldings = JSON.parse(localStorage.getItem(STORE + '_h') || '[]');
let curMonth = DATA.as_of.slice(0, 7);
let inputType = 'expense';
let inputCat = 'food';

if (!txns) { txns = seed(); persist(); }

function persist() { localStorage.setItem(STORE, JSON.stringify(txns)); }
function persistH() { localStorage.setItem(STORE + '_h', JSON.stringify(extraHoldings)); }

function pad(n) { return String(n).padStart(2, '0'); }
function fmtDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayStr() { return fmtDate(new Date()); }
function ymOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }

function seed() {
  let s = 20261018;
  const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const notes = {
    food: ['午饭', '晚饭', '外卖', '咖啡', '早餐', '夜宵', '超市买菜'],
    traffic: ['地铁', '打车', '公交', '加油', '高铁票'],
    shop: ['日用品', '衣服', '耳机', '快递', '护肤品'],
    home: ['房租', '水费', '电费', '物业费'],
    fun: ['电影', '演出', '游戏', '会员'],
    comm: ['话费', '宽带'],
    med: ['感冒药', '体检'],
    gift: ['随礼', '礼物', '请客']
  };
  const range = {
    food: [15, 95], traffic: [4, 62], shop: [29, 460], home: [180, 2400],
    fun: [25, 220], comm: [39, 120], med: [18, 380], gift: [100, 800]
  };
  const out = [];
  const now = new Date(DATA.as_of + 'T12:00:00');
  let id = 1;

  for (let back = 1; back >= 0; back--) {
    const base = new Date(now.getFullYear(), now.getMonth() - back, 1);
    const y = base.getFullYear(), m = base.getMonth();
    const lastDay = new Date(y, m + 1, 0).getDate();
    const maxDay = (back === 0) ? now.getDate() : lastDay;

    out.push({
      id: id++, date: y + '-' + pad(m + 1) + '-10', type: 'income',
      amount: 12800, cat: 'salary', note: '工资'
    });
    if (back === 1) {
      out.push({ id: id++, date: y + '-' + pad(m + 1) + '-22', type: 'income', amount: 1800, cat: 'bonus', note: '项目奖金' });
    }
    out.push({
      id: id++, date: y + '-' + pad(m + 1) + '-01', type: 'expense',
      amount: 2600, cat: 'home', note: '房租'
    });

    const count = back === 0 ? 38 : 44;
    for (let i = 0; i < count; i++) {
      const cat = pick(['food', 'food', 'food', 'food', 'traffic', 'traffic', 'shop', 'shop', 'fun', 'comm', 'med', 'gift']);
      const day = 2 + Math.floor(rnd() * Math.max(1, maxDay - 1));
      if (day > maxDay) continue;
      const r = range[cat];
      let amt = r[0] + rnd() * (r[1] - r[0]);
      amt = Math.round(amt * 10) / 10;
      out.push({
        id: id++, date: y + '-' + pad(m + 1) + '-' + pad(day), type: 'expense',
        amount: amt, cat: cat, note: pick(notes[cat])
      });
    }
  }
  return out.sort((a, b) => a.date < b.date ? 1 : -1);
}

function money(v) {
  const n = Math.abs(v);
  const s = Number.isInteger(n)
    ? n.toLocaleString('zh-CN')
    : n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (v < 0 ? '-' : '') + s;
}
function signMoney(v) { return (v > 0 ? '+' : v < 0 ? '-' : '') + '¥' + money(Math.abs(v)); }
function clsOf(v) { return v > 0 ? 'up' : v < 0 ? 'down' : ''; }

function allHoldings() {
  return DATA.holdings.concat(extraHoldings);
}

function renderAssets() {
  const hs = allHoldings();
  const total = hs.reduce((s, h) => s + (h.mv || 0), 0);
  const day = hs.reduce((s, h) => s + (h.day_pnl || 0), 0);
  const pnl = hs.reduce((s, h) => s + (h.pnl || 0), 0);
  const cost = hs.reduce((s, h) => s + (h.cost || 0), 0);
  const pct = cost ? pnl / cost * 100 : 0;

  document.getElementById('total-mv').innerHTML = '<span class="unit">¥</span>' + money(Math.round(total));
  const dEl = document.getElementById('day-pnl');
  dEl.textContent = '今日 ' + signMoney(day);
  dEl.className = clsOf(day);
  const aEl = document.getElementById('all-pnl');
  aEl.textContent = '累计 ' + signMoney(pnl) + '（' + (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%）';
  aEl.className = clsOf(pnl);

  const groups = {};
  hs.forEach(h => {
    const k = h.type === 'fund' ? '基金' : h.type === 'a' ? 'A 股' : h.type === 'hk' ? '港股' : '美股';
    groups[k] = (groups[k] || 0) + (h.mv || 0);
  });
  const colors = { 'A 股': '#C9594A', '港股': '#4A78B8', '美股': '#7A66C0', '基金': '#4E8A5F' };
  const order = ['A 股', '港股', '美股', '基金'].filter(k => groups[k]);
  document.getElementById('alloc').innerHTML = order.map(k => {
    const p = total ? groups[k] / total * 100 : 0;
    return '<div class="bar-row">'
      + '<div class="bar-top"><span class="n">' + k + '</span><span class="v">¥' + money(groups[k]) + '　' + p.toFixed(1) + '%</span></div>'
      + '<div class="track"><div class="fill" style="width:' + p.toFixed(2) + '%;background:' + colors[k] + '"></div></div>'
      + '</div>';
  }).join('');

  const top = hs.slice().sort((a, b) => (b.mv || 0) - (a.mv || 0)).slice(0, 3);
  document.getElementById('home-holdings').innerHTML = top.map(rowHTML).join('');
  document.getElementById('data-time').textContent = DATA.fetched_at.slice(0, 16).replace('T', ' ');

  const st = monthStats(curMonth);
  document.getElementById('home-spend').innerHTML =
    '<div style="display:flex;align-items:baseline;gap:8px">'
    + '<div style="font-size:26px;font-weight:600;letter-spacing:-.6px;font-variant-numeric:tabular-nums">¥' + money(st.expense) + '</div>'
    + '<div style="font-size:12px;color:#A6A49E">' + curMonth.replace('-', ' 年 ') + ' 月</div>'
    + '</div>';
}

function rowHTML(h) {
  const tagCls = h.type === 'a' ? 'ta' : h.type === 'hk' ? 'th' : h.type === 'us' ? 'tu' : 'tf';
  const tagTxt = h.type === 'a' ? 'A股' : h.type === 'hk' ? '港股' : h.type === 'us' ? '美股' : '基金';
  return '<div class="h-row">'
    + '<div class="h-left"><div class="h-name">' + h.name + '<span class="tag ' + tagCls + '">' + tagTxt + '</span></div>'
    + '<div class="h-code">' + h.code + ' · ' + (h.price ? h.price.toFixed(2) : '—') + '</div></div>'
    + '<div class="h-right"><div class="h-mv">' + money(h.mv || 0) + '</div>'
    + '<div class="h-pnl ' + clsOf(h.pnl || 0) + '">' + signMoney(h.pnl || 0)
    + (h.pnl_pct ? '（' + (h.pnl_pct > 0 ? '+' : '') + h.pnl_pct.toFixed(2) + '%）' : '') + '</div></div>'
    + '</div>';
}

function renderHoldings() {
  const hs = allHoldings().slice().sort((a, b) => (b.mv || 0) - (a.mv || 0));
  document.getElementById('holdings-card').innerHTML = hs.map(h => {
    const tagCls = h.type === 'a' ? 'ta' : h.type === 'hk' ? 'th' : h.type === 'us' ? 'tu' : 'tf';
    const tagTxt = h.type === 'a' ? 'A股' : h.type === 'hk' ? '港股' : h.type === 'us' ? '美股' : '基金';
    const pctTxt = h.pct === undefined || h.pct === null ? '' :
      '<span class="' + clsOf(h.pct) + '">' + (h.pct > 0 ? '+' : '') + h.pct.toFixed(2) + '%</span>';
    return '<div class="h-row">'
      + '<div class="h-left"><div class="h-name">' + h.name + '<span class="tag ' + tagCls + '">' + tagTxt + '</span></div>'
      + '<div class="h-code">' + h.code + '　' + (h.price ? h.price.toFixed(2) : '—') + '　' + pctTxt + '</div></div>'
      + '<div class="h-right"><div class="h-mv">¥' + money(h.mv || 0) + '</div>'
      + '<div class="h-pnl ' + clsOf(h.pnl || 0) + '">' + signMoney(h.pnl || 0) + '</div></div>'
      + '</div>';
  }).join('');
}

function monthStats(ym) {
  const list = txns.filter(t => t.date.slice(0, 7) === ym);
  const expense = list.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
  const income = list.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  const byCat = {};
  list.filter(t => t.type === 'expense').forEach(t => {
    byCat[t.cat] = (byCat[t.cat] || 0) + t.amount;
  });
  const cats = Object.keys(byCat).map(k => ({
    k: k, n: (CAT_MAP[k] || { n: k }).n, c: (CAT_MAP[k] || { c: '#999' }).c,
    v: byCat[k], p: expense ? byCat[k] / expense * 100 : 0
  })).sort((a, b) => b.v - a.v);
  return { expense: expense, income: income, balance: income - expense, cats: cats, list: list };
}

function renderFlow() {
  const st = monthStats(curMonth);
  document.getElementById('flow-month').textContent = curMonth.replace('-', ' 年 ') + ' 月';
  document.getElementById('flow-sum').innerHTML =
    '<div><div class="k">支出</div><div class="v">' + money(st.expense) + '</div></div>'
    + '<div><div class="k">收入</div><div class="v up">' + money(st.income) + '</div></div>'
    + '<div><div class="k">结余</div><div class="v">' + money(st.balance) + '</div></div>';

  const list = st.list.slice().sort((a, b) => a.date < b.date ? 1 : -1);
  if (!list.length) {
    document.getElementById('flow-list').innerHTML = '<div class="empty"><div class="big">这个月还没有记录</div>点中间的 ＋ 记第一笔</div>';
    return;
  }
  const groups = {};
  list.forEach(t => { (groups[t.date] = groups[t.date] || []).push(t); });
  const week = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  document.getElementById('flow-list').innerHTML = Object.keys(groups).sort().reverse().map(d => {
    const items = groups[d];
    const out = items.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const dt = new Date(d + 'T12:00:00');
    const label = (dt.getMonth() + 1) + '月' + dt.getDate() + '日 ' + week[dt.getDay()];
    const rows = items.map(t => {
      const c = CAT_MAP[t.cat] || { n: t.cat, c: '#999' };
      const sign = t.type === 'expense' ? '-' : '+';
      return '<div class="txn" onclick="delTxn(' + t.id + ')">'
        + '<div class="ico" style="background:' + c.c + '">' + c.n.slice(0, 1) + '</div>'
        + '<div class="txn-mid"><div class="txn-cat">' + c.n + '</div>'
        + '<div class="txn-note">' + (t.note || '　') + '</div></div>'
        + '<div class="txn-amt ' + (t.type === 'income' ? 'up' : '') + '">' + sign + money(t.amount) + '</div>'
        + '</div>';
    }).join('');
    return '<div class="day-group"><div class="day-head"><span>' + label + '</span><span>支出 ' + money(out) + '</span></div>'
      + '<div class="txn-list">' + rows + '</div></div>';
  }).join('');
}

function renderSummary() {
  const st = monthStats(curMonth);
  const prev = prevMonth(curMonth);
  const stPrev = monthStats(prev);
  const diff = stPrev.expense ? (st.expense - stPrev.expense) / stPrev.expense * 100 : 0;

  document.getElementById('sum-month').textContent = curMonth.replace('-', ' 年 ') + ' 月';

  if (!st.expense) {
    document.getElementById('summary-card').innerHTML = '<div class="empty"><div class="big">本月还没有支出</div>记一笔就能看到分析</div>';
    return;
  }

  let acc = 0;
  const stops = st.cats.map(c => {
    const from = acc, to = acc + c.p;
    acc = to;
    return c.c + ' ' + from.toFixed(2) + '% ' + to.toFixed(2) + '%';
  }).join(', ');

  const catRows = st.cats.map(c =>
    '<div class="cat-row"><div class="cat-dot" style="background:' + c.c + '"></div>'
    + '<div class="cat-n">' + c.n + '</div>'
    + '<div class="cat-v">' + money(c.v) + '</div>'
    + '<div class="cat-p">' + c.p.toFixed(0) + '%</div></div>'
  ).join('');

  const diffTxt = stPrev.expense
    ? '较上月 <span class="' + clsOf(diff) + '">' + (diff > 0 ? '+' : '') + diff.toFixed(1) + '%</span>'
    : '上月无记录';

  document.getElementById('summary-card').innerHTML =
    '<div class="donut-wrap"><div class="donut" style="background:conic-gradient(' + stops + ')">'
    + '<div class="donut-c"><div class="k">本月支出</div><div class="v">¥' + money(st.expense) + '</div></div>'
    + '</div></div>'
    + '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:#A6A49E;padding:0 2px 14px;border-bottom:1px solid #F2F0EB">'
    + '<span>收入 ¥' + money(st.income) + '</span><span>结余 ¥' + money(st.balance) + '</span><span>' + diffTxt + '</span></div>'
    + '<div style="padding-top:8px">' + catRows + '</div>';
}

function prevMonth(ym) {
  const p = ym.split('-');
  let y = +p[0], m = +p[1] - 1;
  if (m === 0) { m = 12; y--; }
  return y + '-' + pad(m);
}
function nextMonth(ym) {
  const p = ym.split('-');
  let y = +p[0], m = +p[1] + 1;
  if (m === 13) { m = 1; y++; }
  return y + '-' + pad(m);
}

function shiftMonth(d) {
  curMonth = d < 0 ? prevMonth(curMonth) : nextMonth(curMonth);
  renderFlow();
  renderSummary();
  renderAssets();
}

function go(v) {
  document.querySelectorAll('.view').forEach(e => e.classList.remove('on'));
  document.getElementById('v-' + v).classList.add('on');
  document.querySelectorAll('.tab').forEach(e => e.classList.toggle('on', e.dataset.v === v));
  if (v === 'flow') renderFlow();
  if (v === 'summary') renderSummary();
  if (v === 'holdings') renderHoldings();
  if (v === 'assets') renderAssets();
  window.scrollTo(0, 0);
}

function buildCatGrid() {
  const cats = CATS[inputType];
  document.getElementById('cat-grid').innerHTML = cats.map(c =>
    '<div class="gi' + (c.k === inputCat ? ' on' : '') + '" onclick="pickCat(\'' + c.k + '\')">'
    + '<div class="c" style="background:' + c.c + '">' + c.n.slice(0, 1) + '</div>'
    + '<div class="n">' + c.n + '</div></div>'
  ).join('');
}

function pickCat(k) { inputCat = k; buildCatGrid(); }

function setType(t) {
  inputType = t;
  inputCat = t === 'expense' ? 'food' : 'salary';
  document.querySelectorAll('#seg-type div').forEach((e, i) => e.classList.toggle('on', (i === 0) === (t === 'expense')));
  buildCatGrid();
}

function openAdd() {
  document.getElementById('sheet-add').classList.add('on');
  document.getElementById('in-amt').value = '';
  document.getElementById('in-note').value = '';
  document.getElementById('btn-save').disabled = true;
  setType('expense');
  setTimeout(() => document.getElementById('in-amt').focus(), 260);
}
function closeAdd() {
  document.getElementById('sheet-add').classList.remove('on');
}

function saveTxn() {
  const v = parseFloat(document.getElementById('in-amt').value);
  if (!v || v <= 0) return;
  const note = document.getElementById('in-note').value.trim();
  txns.push({
    id: Date.now(), date: todayStr(), type: inputType,
    amount: Math.round(v * 100) / 100, cat: inputCat, note: note
  });
  persist();
  closeAdd();
  renderAssets(); renderFlow(); renderSummary();
  toast(inputType === 'expense' ? '已记一笔支出' : '已记一笔收入');
}

function delTxn(id) {
  const t = txns.find(x => x.id === id);
  if (!t) return;
  if (!confirm('删除这笔「' + (CAT_MAP[t.cat] || {}).n + ' ¥' + money(t.amount) + '」？')) return;
  txns = txns.filter(x => x.id !== id);
  persist();
  renderFlow(); renderSummary(); renderAssets();
  toast('已删除');
}

function openHolding() { document.getElementById('sheet-holding').classList.add('on'); }
function closeHolding() { document.getElementById('sheet-holding').classList.remove('on'); }

function saveHolding() {
  const code = document.getElementById('h-code').value.trim().toUpperCase();
  const type = document.getElementById('h-type').value;
  const cost = parseFloat(document.getElementById('h-cost').value);
  const shares = parseFloat(document.getElementById('h-shares').value);
  if (!code || !cost || !shares) { toast('请填写完整'); return; }

  const fxRate = type === 'hk' ? (DATA.fx.HKD || 1) : type === 'us' ? (DATA.fx.USD || 1) : 1;
  const mv = cost * shares * fxRate;
  extraHoldings.push({
    name: code, code: code, type: type, price: cost, mv: mv, cost: mv,
    pnl: 0, pnl_pct: 0, day_pnl: 0, pct: null, date: todayStr(), manual: true
  });
  persistH();
  closeHolding();
  document.getElementById('h-code').value = '';
  document.getElementById('h-cost').value = '';
  document.getElementById('h-shares').value = '';
  renderAssets(); renderHoldings();
  toast('已添加，行情待下次更新');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 1600);
}

document.getElementById('in-amt').addEventListener('input', e => {
  document.getElementById('btn-save').disabled = !(parseFloat(e.target.value) > 0);
});
document.getElementById('in-amt').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveTxn();
});

buildCatGrid();
renderAssets();
</script>
</body>
</html>
