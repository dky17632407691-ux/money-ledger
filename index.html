<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="生活记账本：日常收支与持仓，可选用 GitHub Gist 在多设备间同步">
<title>生活记账本</title>
<link rel="stylesheet" href="styles.css?v=202611011430">
</head>
<body>
<div id="boot" class="boot">
  <div class="boot__logo">账</div>
  <div class="boot__spinner"></div>
  <p class="boot__text">正在加载…</p>
</div>

<div id="app" class="app hidden">
  <main id="page" class="page"></main>
  <button type="button" id="fab-add" class="fab" aria-label="记一笔">＋</button>
  <nav class="tabbar" aria-label="主导航">
    <button type="button" class="tabbar__btn is-active" data-tab="overview"><span>概览</span></button>
    <button type="button" class="tabbar__btn" data-tab="daily"><span>日常</span></button>
    <button type="button" class="tabbar__btn" data-tab="assets"><span>资产</span></button>
    <button type="button" class="tabbar__btn" data-tab="stats"><span>统计</span></button>
    <button type="button" class="tabbar__btn" data-tab="me"><span>我的</span></button>
  </nav>
</div>

<script type="module" src="js/app.js?v=202611011430"></script>
</body>
</html>
